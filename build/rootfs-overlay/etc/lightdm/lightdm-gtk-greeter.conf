[greeter]
# VertexOS branded greeter
background = /usr/share/backgrounds/vertexos/wallpaper-02-shield.png
theme-name = Adwaita-dark
icon-theme-name = Adwaita
font-name = Noto Sans 11

# Logo + greeting
default-user-image = /usr/share/pixmaps/vertexos-logo.png
hide-user-image = false

# Layout
position = 50%,center 60%,center
panel-position = top
clock-format = %H:%M  ·  %A %d %B
indicators = ~clock;~spacer;~session;~language;~power

# Behaviour
allow-debugging = false
keyboard = onboard
