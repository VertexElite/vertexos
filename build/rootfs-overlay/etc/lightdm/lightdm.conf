# VertexOS lightdm core config — autologin the live user into XFCE.
# Override of upstream /etc/lightdm/lightdm.conf for the live ISO.
# (Installed system will have its own user — void-installer reconfigures.)

[LightDM]
# Run as :0 display by default
minimum-display-number=0

[Seat:*]
# Greeter binary (we customize via lightdm-gtk-greeter.conf separately)
greeter-session=lightdm-gtk-greeter
user-session=xfce

# Autologin — go straight to XFCE without password prompt for the live user.
# The user 'vertex' is added to the 'autologin' group in dracut/vmklive/adduser.sh,
# which is required by PAM for passwordless lightdm autologin.
autologin-user=vertex
autologin-user-timeout=0
autologin-session=xfce
#autologin-guest=false

# Show user list in greeter if autologin is disabled
greeter-hide-users=false

# Allow guest sessions: no
allow-guest=false

# Allow user switching via greeter: no (locked-down posture)
greeter-allow-guest=false

# Show keyboard layout selector: yes (Sri Lanka users may need)
greeter-show-manual-login=true
