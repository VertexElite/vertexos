# VertexOS resource limits hardening.
# Limits DoS surface from fork-bomb / OOM-killer manipulation / core-dump
# information leak (CVE leaks via /var/lib/systemd/coredump-equivalent).

# Disable core dumps for all users (no info leak via crash artifacts).
# Override per-user with `sudo prlimit --core=unlimited:unlimited -p <pid>`.
*   hard   core         0
*   soft   core         0

# Prevent fork-bomb runaway: 1024 procs per user by default.
*   soft   nproc        1024
*   hard   nproc        4096

# Reasonable per-process file descriptor limits.
*   soft   nofile       4096
*   hard   nofile       16384

# Memory locking — small allowance for things like gpg-agent that pin pages
*   soft   memlock      64
*   hard   memlock      64

# Real-time priority — block unless user is in `audio` group
*       hard   rtprio   0
@audio  hard   rtprio   95

# Maximum logged-in sessions per user (mitigates session-hijack persistence)
*   hard   maxlogins    10
