# VertexOS AIDE policy — filesystem integrity focused on the surfaces a
# supply-chain attack or a compromised agent uses to TAMPER or PERSIST:
# system binaries, global package-manager dirs, config, cron, services, sudoers,
# PAM and SSH key material. Volatile paths are excluded to keep checks fast.
#
# Installed at /etc/aide.conf. Driven by /usr/local/bin/vtx-aide-check.

database_in  = file:/var/lib/aide/aide.db
database_out = file:/var/lib/aide/aide.db.new
gzip_dbout   = yes
report_url   = stdout

# ── attribute groups ──
Bins  = p+i+n+u+g+s+b+m+c+sha256   # binaries/libs: full content hash
Full  = p+i+n+u+g+s+b+m+c+sha256   # config: content + metadata
Perms = p+i+u+g                    # metadata only

# ── system binaries & libraries ──
/usr/bin        Bins
/usr/sbin       Bins
/bin            Bins
/sbin           Bins
/usr/local/bin  Bins
/usr/local/sbin Bins
/usr/lib        Bins
/usr/local/lib  Bins

# ── global package-manager install dirs (supply-chain surface) ──
/usr/lib/node_modules        Bins
/usr/local/lib/node_modules  Bins

# ── config + persistence surfaces ──
/etc            Full
/etc/cron.d     Full
/etc/cron.daily Full
/etc/systemd    Full
/etc/sv         Full
/etc/sudoers    Full
/etc/sudoers.d  Full
/etc/pam.d      Full
/etc/profile.d  Full
/root/.ssh      Full

# ── exclusions (volatile / noisy) ──
!/etc/mtab
!/etc/resolv.conf
!/root/.ssh/known_hosts
!/var/log
!/var/cache
!/var/tmp
!/tmp
!/proc
!/sys
!/dev
!/run
