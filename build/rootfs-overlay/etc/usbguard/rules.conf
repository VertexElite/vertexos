# VertexOS USBGuard rules — seed allowlist.
#
# Allow root hub controllers + HID class (built-in keyboard/touchpad for
# laptops) so the system stays usable. All other devices BLOCKED by default;
# user grants via `usbguard allow-device <id>` or desktop notifier.
#
# To dump current devices and craft custom rules:  usbguard list-devices
# To regenerate this file from currently-attached devices:
#   usbguard generate-policy > /etc/usbguard/rules.conf
#
# Order matters — first match wins.

# Allow USB root hubs (almost all PCs need these visible).
allow id 1d6b:0001  # Linux Foundation 1.1 root hub
allow id 1d6b:0002  # Linux Foundation 2.0 root hub
allow id 1d6b:0003  # Linux Foundation 3.0 root hub

# Allow HID built-in (keyboard, mouse, touchpad attached internally)
# Restricted to interface class 03 (HID) — devices with mixed HID+something
# else (BadUSB pattern) get blocked at the second interface.
allow with-interface 03:*:*

# Reject HID devices that ALSO expose other interfaces (composite BadUSB).
reject with-interface { 03:*:* } with-interface !03:*:*

# Block everything else by default.
block
