# VertexOS USBGuard configuration.
# Default policy: BLOCK all USB devices, prompt the user via desktop notifier.
# Mitigates: BadUSB / Rubber Ducky / HID injection / mass-storage drive-by /
# malicious peripheral firmware (JL silicon class).

# Path to the rule set. Built by `vertex-usb-allow` CLI on user approval.
RuleFile=/etc/usbguard/rules.conf

# Treat unknown devices as: block (apply -> rules.conf processing -> default).
ImplicitPolicyTarget=block

# Devices present at daemon start (i.e. already-attached when the system
# boots): apply the rules file. Apply default-block target if not matched.
PresentDevicePolicy=apply-policy
PresentControllerPolicy=apply-policy

# When the system is unlocked (interactive desktop session), prompt the user
# on every new device insertion. When locked, block silently.
InsertedDevicePolicy=apply-policy

# Restore device's controller state if a controller was unplugged + replugged.
# Defaults are reasonable.
RestoreControllerDeviceState=false

# Daemon socket — accessible only to root + usbguard group (NM-applet sub-user).
IPCAllowedUsers=root
IPCAllowedGroups=wheel usbguard

# Audit logging
AuditFilePath=/var/log/usbguard/usbguard-audit.log
AuditBackend=FileAudit

# Hooks for desktop notifications (Phase 1.5: vertex-usb-notify integration)
# HookExecuteOnDevice=/usr/lib/vertexos/usb-notify.sh
