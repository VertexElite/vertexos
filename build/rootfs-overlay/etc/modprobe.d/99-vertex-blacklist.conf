# VertexOS — kernel module blacklist
# Modules with active 2025-2026 LPE CVEs that VertexOS desktop never needs.
# Loaded only on systems that specifically opt in via override file.

# CVE-2026-31431 "Copy Fail" — algif_aead arbitrary page-cache write → root via /usr/bin/su overwrite
install algif_aead /bin/true

# CVE-2026-43284/43500 "Dirty Frag" — IPsec ESP page-cache write primitive
install esp4    /bin/true
install esp6    /bin/true
install esp4_offload /bin/true
install esp6_offload /bin/true

# CVE-2026-43500 "Dirty Frag" RxRPC variant — arbitrary page-cache write, no userns needed
install rxrpc /bin/true
install kafs  /bin/true

# CVE-2026-43494 "PinTheft" — RDS + io_uring page-cache overwrite
install rds     /bin/true
install rds_tcp /bin/true
install rds_rdma /bin/true

# CVE-2026-46300 "Fragnesia" — XFRM ESP-in-TCP skb frag-sharing arbitrary writes
# (covered by esp4/esp6 blacklist above)

# Legacy / largely-unused protocols that have repeatedly been LPE sources
install dccp    /bin/true
install sctp    /bin/true
install rds     /bin/true
install tipc    /bin/true
install n-hdlc  /bin/true
install ax25    /bin/true
install netrom  /bin/true
install x25     /bin/true
install rose    /bin/true
install decnet  /bin/true
install econet  /bin/true
install af_802154 /bin/true
install ipx     /bin/true
install appletalk /bin/true
install psnap   /bin/true
install p8023   /bin/true
install p8022   /bin/true
install can     /bin/true
install atm     /bin/true

# Firewire (DMA over interface — used in cold-boot / DMA attacks)
install firewire-core /bin/true
install firewire-ohci /bin/true
install firewire-sbp2 /bin/true

# Thunderbolt DMA attack surface (xfwm sees them anyway via PCIe)
# Leave thunderbolt module loaded but configured for "user" PCIe authorization
# via /etc/systemd/system or runit equivalent — not blacklisted.

# Uncommon filesystems with historical LPE bugs
install cramfs   /bin/true
install freevxfs /bin/true
install jffs2    /bin/true
install hfs      /bin/true
install hfsplus  /bin/true
# squashfs intentionally NOT blacklisted - required for live-ISO root + flatpak.
install udf      /bin/true
install reiserfs /bin/true
install ksmbd    /bin/true
