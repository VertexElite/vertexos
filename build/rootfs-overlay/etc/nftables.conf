#!/usr/sbin/nft -f
# VertexOS default nftables ruleset.
# Installed at /etc/nftables.conf; loaded by nftables runit service.
# Phase 3 will add: XDP Sentinel hook, CrowdSec bouncer chain.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        iif lo accept
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept limit rate 5/second
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # SSH — comment out for desktop-only profile; tighten with `from-source` post-install.
        # tcp dport 22 ct state new limit rate 3/minute accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
