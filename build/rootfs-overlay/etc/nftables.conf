#!/usr/sbin/nft -f
# VertexOS default nftables ruleset.
# Installed at /etc/nftables.conf; loaded by the nftables runit service.
#
# Default-deny INBOUND *and* EGRESS. Dropped packets are LOGGED:
#   inbound  -> "vtx-drop "         egress -> "vtx-egress-drop "
# VertexSense tails the kernel log for both prefixes and renders blocked
# connections live. Egress default-deny is what makes supply-chain C2 / exfil
# from a compromised dependency or coding-agent show up (and get stopped).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        iif lo accept
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 5/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # SSH — off by default for the desktop profile. Uncomment + scope to a
        # source range for the appliance profile.
        # tcp dport 22 ct state new limit rate 3/minute accept

        # Anything unmatched is dropped by policy. Log it first (rate-limited so a
        # scan can't flood the journal) — VertexSense reads the "vtx-drop " prefix.
        limit rate 10/second burst 20 packets log prefix "vtx-drop " level info
        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy drop;

        # --- Hardened default-deny egress + allow-list ---
        # Reply traffic for connections we already accepted.
        ct state established,related accept
        oif lo accept

        # DNS — system stub + DoT (stubby on 853).
        udp dport 53 accept
        tcp dport 53 accept
        tcp dport 853 ct state new accept

        # Web + package mirrors (xbps/pip/npm/cargo over HTTPS).
        tcp dport { 80, 443 } ct state new accept

        # Time sync (chrony) and DHCP client.
        udp dport 123 accept
        udp sport 68 udp dport 67 accept

        # Diagnostic ICMP egress (ping out + PMTU discovery).
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Everything else is supply-chain exfil / C2 until proven otherwise:
        # log it (VertexSense reads "vtx-egress-drop ") then drop.
        limit rate 10/second burst 20 packets log prefix "vtx-egress-drop " level info
        counter drop
    }
}
