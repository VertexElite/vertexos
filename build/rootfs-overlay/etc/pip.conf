# VertexOS default pip config — system-wide hardening for Python supply chain.
# Mitigates: pip post-install RCE (CVE-2026-6357), .pth files in site-packages
# executing at every interpreter start (Hades pattern — PyTorch Lightning,
# Intercom, LiteLLM, Microsoft durabletask compromises in 2026).

[global]
# Index — pin to official PyPI; stubby DoT enforces resolution.
index-url = https://pypi.org/simple/

# Prefer wheels (binary) over sdists. sdists run setup.py which can do anything.
# only-binary :all: blocks setup.py execution entirely for the package.
prefer-binary = true

# Refuse insecure transports
trusted-host = pypi.org files.pythonhosted.org

# Verify hashes when present in requirements
require-hashes = false   # set true for tight workflows; default lenient for usability

# Cache wheel downloads to reduce repeated network trips
cache-dir = ~/.cache/pip

# Hide deprecation warnings unless verbose
disable-pip-version-check = true

# Resolver: backtrack on conflicts strictly
resolver = backtracking

[install]
# Refuse install from arbitrary git/file/url unless explicit
# (-e supports them; bare `pip install` will fail-closed without --no-deps)
no-warn-script-location = false

# Compile .pyc files at install time so site-packages doesn't generate them at
# import time (avoids .pth-style first-import execution surprises)
compile = true

# By default DO NOT install build-system isolation packages from the network.
# This is the primary attack-surface (build-time arbitrary code execution).
# Override with --use-pep517 + verified setup.py per-package after vetting.
no-build-isolation = true
