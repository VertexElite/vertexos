# VertexOS hardened sysctl drop-in.
# Applied via /etc/sysctl.d/99-vertex-harden.conf at install time.
# Tightens over Void's stock defaults (which already cover the basics).
#
# Reference: KSPP recommended settings + Chimera Linux defaults.

# ── Kernel info hiding ────────────────────────────────────────────────────────
kernel.kptr_restrict           = 2     # Void stock = 1; we go to 2 (hide for all)
kernel.dmesg_restrict          = 1     # already 1 in Void stock; re-asserted
kernel.printk                  = 3 3 3 3
kernel.kexec_load_disabled     = 1     # already 1 in Void stock
kernel.unprivileged_bpf_disabled = 1   # already 1 in Void stock
net.core.bpf_jit_harden        = 2     # constant blinding even for privileged
kernel.yama.ptrace_scope       = 2     # Void stock = 1; we go to 2 (root-only ptrace)
kernel.perf_event_paranoid     = 3     # Void stock = 2; we go to 3 (no perf_event_open for unprivileged)

# ── Userland mitigations ──────────────────────────────────────────────────────
fs.protected_hardlinks         = 1
fs.protected_symlinks          = 1
fs.protected_fifos             = 2
fs.protected_regular           = 2
fs.suid_dumpable               = 0
kernel.core_uses_pid           = 1

# ── Network stack hardening ───────────────────────────────────────────────────
net.ipv4.conf.all.rp_filter            = 1
net.ipv4.conf.default.rp_filter        = 1
net.ipv4.tcp_syncookies                = 1
net.ipv4.conf.all.accept_redirects     = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects     = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects       = 0
net.ipv4.conf.default.send_redirects   = 0
net.ipv4.conf.all.accept_source_route     = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians         = 1
net.ipv4.icmp_echo_ignore_broadcasts   = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_rfc1337                   = 1

net.ipv6.conf.all.accept_redirects     = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route  = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_ra            = 0
net.ipv6.conf.default.accept_ra        = 0

# ── ASLR ──────────────────────────────────────────────────────────────────────
kernel.randomize_va_space      = 2

# ── User namespaces (off by default; flip if containers needed) ───────────────
# kernel.unprivileged_userns_clone is Debian/Ubuntu-patch-only; absent on mainline 6.18 (boot warning, always a no-op here).
# Mainline options to actually block unprivileged user-namespace LPE:
#   (a) kernel build: CONFIG_USER_NS_UNPRIVILEGED=n  (cleanest; needs kernel rebuild)
#   (b) user.max_user_namespaces = 0  (blunt: disables ALL userns incl. browser/rootless-container sandboxes)
# vtx-sandbox is AppArmor-based (not userns) so (b) would not break the agent sandbox. Left enabled by default.

# Block unprivileged user-namespace LPE (white-team V7). vtx-sandbox is
# AppArmor-based so this does not break the agent sandbox.
user.max_user_namespaces = 0
