#!/usr/sbin/nft -f
# VertexOS default nftables ruleset.
# Installed at /etc/nftables.conf; loaded by the nftables runit service.
#
# Default-deny inbound. Dropped packets are LOGGED with the "vtx-drop " prefix
# so VertexSense can render blocked connections live (it tails the kernel log for
# that prefix). Phase 3: XDP Sentinel hook + CrowdSec bouncer chain.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        iif lo accept
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept limit rate 5/second
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # SSH — off by default for the desktop profile. Uncomment + scope to a
        # source range for the appliance profile.
        # tcp dport 22 ct state new limit rate 3/minute accept

        # Anything unmatched is dropped by policy. Log it first (rate-limited so a
        # scan can't flood the journal) — VertexSense reads the "vtx-drop " prefix.
        limit rate 10/second burst 20 packets log prefix "vtx-drop " level info
        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;

        # Egress stays open for a developer desktop. For the hardened "appliance"
        # profile, flip to default-deny and allow-list — and log blocked egress so
        # supply-chain exfil shows up in VertexSense:
        #   ct state established,related accept
        #   oif lo accept
        #   udp dport { 53 } accept
        #   tcp dport { 80, 443 } ct state new accept
        #   limit rate 10/second log prefix "vtx-egress-drop " level info
        #   counter drop
    }
}
