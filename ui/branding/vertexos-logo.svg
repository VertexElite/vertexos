<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#00c9a7"/>
      <stop offset="60%" stop-color="#2d7dd2"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#00c9a7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer shield -->
  <path d="M256 32 L460 96 L460 240 C460 348 384 444 256 480 C128 444 52 348 52 240 L52 96 Z"
        fill="url(#shieldGrad)"
        stroke="#1a2d45"
        stroke-width="6"/>

  <!-- Inner shield depth -->
  <path d="M256 64 L432 116 L432 240 C432 332 372 416 256 448 C140 416 80 332 80 240 L80 116 Z"
        fill="none"
        stroke="#00c9a7"
        stroke-width="2"
        opacity="0.45"/>

  <!-- V mark -->
  <path d="M152 156 L256 392 L360 156 L320 156 L256 308 L192 156 Z"
        fill="url(#vGrad)"
        filter="url(#glow)"/>

  <!-- Small accent dots (sensor pulse) -->
  <circle cx="120" cy="120" r="4" fill="#ff6b35"/>
  <circle cx="392" cy="120" r="4" fill="#ff6b35"/>
  <circle cx="256" cy="416" r="4" fill="#ff6b35"/>
</svg>
