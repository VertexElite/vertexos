# VertexOS picom config — Aero-style glass / blur.
# Loaded from xfce4-session autostart.

backend          = "glx";
vsync            = true;
use-damage       = true;

# ── Blur (Aero glass) ─────────────────────────────────────────────────────────
blur-method      = "dual_kawase";
blur-strength    = 5;
blur-background  = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── Shadows ───────────────────────────────────────────────────────────────────
shadow           = true;
shadow-radius    = 12;
shadow-opacity   = 0.40;
shadow-offset-x  = -10;
shadow-offset-y  = -10;
shadow-exclude   = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── Opacity rules ─────────────────────────────────────────────────────────────
opacity-rule = [
    "90:class_g = 'Xfce4-panel'",
    "95:class_g = 'Thunar'",
    "92:class_g = 'xfce4-terminal'",
];

# ── Animations / fading ───────────────────────────────────────────────────────
fading           = true;
fade-in-step     = 0.04;
fade-out-step    = 0.04;
fade-delta       = 5;

# ── Rounded corners ───────────────────────────────────────────────────────────
corner-radius    = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];
